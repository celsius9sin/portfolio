<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06070b">
<title>Engineer Portfolio</title>
<meta name="description" content="設計・レビュー・調整とAIエージェント活用で開発を前に進めるエンジニアの、経験とスキルのまとめ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="fx fx-vignette" aria-hidden="true"></div>
<div class="fx fx-noise" aria-hidden="true"></div>
<div class="fx fx-scan" aria-hidden="true"></div>
<div class="fx fx-sweep" aria-hidden="true"></div>

<div id="boot" class="boot" aria-hidden="true"><pre id="bootlog"></pre></div>

<header class="hud-top">
  <div>
    <span class="live"><i></i>LIVE</span>
    <span class="hud-title">Engineer // Portfolio</span>
  </div>
  <div>
    <span class="hud-section" id="hudSection">00 // PROFILE</span>
    <span class="signal" aria-hidden="true"><b></b><b></b><b></b><b></b></span>
    <span class="hud-clock" id="clock">00:00:00</span>
  </div>
</header>

<nav class="rail" id="rail" aria-label="セクション"></nav>

<main id="main">
  <section class="hero" id="top" data-hud="00 // PROFILE">
    <div>
      <div class="kicker rv">Player profile // Engineer</div>
      <h1 id="headline" class="glitch rv" style="--i:1"></h1>
      <p id="summary" class="lead-text rv" style="--i:2"></p>
      <div class="stats rv" id="stats" style="--i:3"></div>
      <div class="certs rv" id="certs" style="--i:4"></div>
      <a class="scroll-cue rv" href="#strengths" style="--i:5">SCROLL</a>
    </div>
    <div class="scanner rv" style="--i:2" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none">
        <circle cx="100" cy="100" r="92" stroke="#232838" stroke-width="1"/>
        <g class="ring-a"><circle cx="100" cy="100" r="80" stroke="#3a4157" stroke-width="1" stroke-dasharray="2 6"/><path d="M100 14v10M100 176v10M14 100h10M176 100h10" stroke="#fcee0a" stroke-width="2"/></g>
        <g class="ring-b"><circle cx="100" cy="100" r="62" stroke="#19f3ff" stroke-opacity=".55" stroke-width="1" stroke-dasharray="40 12 4 12"/></g>
        <circle cx="100" cy="100" r="40" stroke="#3a4157" stroke-width="1"/>
        <path d="M100 30v140M30 100h140" stroke="#232838" stroke-width="1"/>
        <g class="sweep"><path d="M100 100L100 20A80 80 0 0 1 156 44Z" fill="#fcee0a" fill-opacity=".08"/><path d="M100 100V20" stroke="#fcee0a" stroke-width="1.5"/></g>
        <path d="M84 92l16-12 16 12v22l-16 12-16-12z" stroke="#fcee0a" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="3" fill="#fcee0a"/>
      </svg>
      <div class="scanner-cap"><span>LINK <b>STABLE</b></span><span>MODE <b>AUTO</b></span></div>
    </div>
  </section>
  <div id="sections"></div>
  <div class="end mono rv" id="end"></div>
</main>

<p id="error" class="error" hidden>コンテンツを読み込めませんでした。</p>

<div class="ticker" aria-hidden="true">
  <div class="ticker-label">NOW</div>
  <div class="ticker-track" id="ticker"></div>
</div>
<div class="reticle" id="reticle" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
