<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineer Portfolio</title>
<meta name="description" content="設計・レビュー・調整と生成AI活用を組み合わせて開発を前に進めるエンジニアの、経験とスキルのまとめ。">
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-muted: #63635d;
    --border: #e5e3dd;
    --accent: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --surface: #1f1f24;
      --text: #ececec;
      --text-muted: #9a9a95;
      --border: #2f2f35;
      --accent: #e0a44d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
  header { padding: 64px 0 24px; }
  header .label { color: var(--accent); font-size: 0.85rem; letter-spacing: 0.08em; margin: 0 0 12px; }
  header h1 { font-size: 1.8rem; line-height: 1.4; margin: 0 0 16px; }
  header p { color: var(--text-muted); margin: 0; max-width: 680px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 0 16px; font-size: 0.9rem; }
  nav a { color: var(--accent); text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  section { padding: 40px 0 8px; }
  section > h2 {
    font-size: 1.25rem;
    margin: 0 0 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .cards { display: grid; gap: 16px; }
  .cards.cols { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card h3 { margin: 0 0 8px; font-size: 1.05rem; line-height: 1.5; }
  .card p { margin: 0; }
  .card .lead { color: var(--text-muted); font-size: 0.95rem; }
  .card ul { margin: 12px 0 0; padding-left: 1.2em; font-size: 0.95rem; }
  .card li + li { margin-top: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tags span {
    font-size: 0.75rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
  }
  .skills h3 { font-size: 0.95rem; margin: 0 0 10px; color: var(--accent); }
  .skills .tags { margin-top: 0; }
  .skills .tags span { font-size: 0.85rem; padding: 3px 10px; }
  .plain { margin: 0; padding-left: 1.2em; }
  footer { padding: 40px 0 64px; color: var(--text-muted); font-size: 0.8rem; }
  .error { color: var(--text-muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="label">ENGINEER PORTFOLIO</p>
    <h1 id="headline"></h1>
    <p id="summary"></p>
  </header>
  <nav id="nav" hidden>
    <a href="#strengths">強み</a>
    <a href="#experience">経験領域</a>
    <a href="#skills">スキル</a>
    <a href="#principles">開発の流儀</a>
    <a href="#learning">学習中</a>
  </nav>
  <main id="main"></main>
  <p id="error" class="error" hidden>コンテンツを読み込めませんでした。</p>
  <footer id="footer"></footer>
</div>
<script>
  function el(tag, opts, children) {
    const node = document.createElement(tag);
    if (opts && opts.cls) node.className = opts.cls;
    if (opts && opts.id) node.id = opts.id;
    if (opts && opts.text != null) node.textContent = opts.text;
    for (const c of children || []) node.appendChild(c);
    return node;
  }
  function tags(items) {
    return el("div", { cls: "tags" }, items.map(t => el("span", { text: t })));
  }
  function list(items, cls) {
    return el("ul", { cls }, items.map(t => el("li", { text: t })));
  }
  function section(id, title, children) {
    return el("section", { id }, [el("h2", { text: title }), ...children]);
  }

  function render(d) {
    document.title = d.title;
    document.getElementById("headline").textContent = d.headline;
    document.getElementById("summary").textContent = d.summary;

    const main = document.getElementById("main");

    main.appendChild(section("strengths", "強み",
      [el("div", { cls: "cards cols" }, d.strengths.map(s =>
        el("div", { cls: "card" }, [el("h3", { text: s.title }), el("p", { cls: "lead", text: s.body })])))]));

    main.appendChild(section("experience", "経験領域",
      [el("div", { cls: "cards" }, d.experience.map(e =>
        el("div", { cls: "card" }, [
          el("h3", { text: e.area }),
          el("p", { cls: "lead", text: e.summary }),
          list(e.points),
          tags(e.tech)
        ])))]));

    main.appendChild(section("skills", "スキル",
      [el("div", { cls: "cards cols skills" }, d.skills.map(s =>
        el("div", { cls: "card" }, [el("h3", { text: s.level }), tags(s.items)])))]));

    main.appendChild(section("principles", "開発の流儀",
      [el("div", { cls: "cards cols" }, d.principles.map(p =>
        el("div", { cls: "card" }, [el("h3", { text: p.title }), el("p", { cls: "lead", text: p.body })])))]));

    main.appendChild(section("learning", "学習中・取り組み中",
      [el("div", { cls: "card" }, [list(d.learning, "plain")])]));

    document.getElementById("nav").hidden = false;
    document.getElementById("footer").textContent = "最終更新: " + d.updated_at;
  }

  fetch("data.json", { cache: "no-store" })
    .then(res => res.json())
    .then(render)
    .catch(() => { document.getElementById("error").hidden = false; });
</script>
</body>
</html>
